<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">河套历史地理骨架示意图</title>
  <desc id="desc">展示黄河几字弯、阴山、鄂尔多斯高原、后套前套西套、主要城塞与南北东西交通方向。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f3e7"/>
      <stop offset="1" stop-color="#e9dec7"/>
    </linearGradient>
    <linearGradient id="plateau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c89b"/>
      <stop offset="1" stop-color="#bba56f"/>
    </linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe0a8"/>
      <stop offset="1" stop-color="#aeca7f"/>
    </linearGradient>
    <pattern id="sand" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1.8" fill="#bd985b" opacity=".55"/>
      <circle cx="13" cy="12" r="1.5" fill="#a98245" opacity=".45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b4a2b"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e78a4"/>
    </marker>
    <style>
      .title { font:700 30px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#392e22; }
      .subtitle { font:15px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#655748; }
      .region { font:700 20px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#47392b; }
      .label { font:600 15px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#2f2923; }
      .small { font:13px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#50473e; }
      .riverlabel { font:600 14px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#205f88; }
      .river { fill:none; stroke:#4a93c2; stroke-width:9; stroke-linecap:round; stroke-linejoin:round; }
      .minorRiver { fill:none; stroke:#78abc9; stroke-width:3; stroke-linecap:round; }
      .mountain { fill:#94825d; stroke:#6d5e40; stroke-width:1.5; opacity:.92; }
      .route { fill:none; stroke:#7b4a2b; stroke-width:4; stroke-dasharray:10 8; marker-end:url(#arrow); }
      .route2 { fill:none; stroke:#a26c36; stroke-width:3; stroke-dasharray:7 7; marker-end:url(#arrow); }
      .node { fill:#6e3e22; stroke:#fff8e9; stroke-width:3; }
      .major { fill:#ad4331; stroke:#fff8e9; stroke-width:3; }
      .modern { fill:#2f6f54; stroke:#fff8e9; stroke-width:3; }
      .gate { fill:#7c4f9b; stroke:#fff8e9; stroke-width:3; }
      .wall { fill:none; stroke:#9a4f42; stroke-width:3; stroke-dasharray:8 6; }
      .legend { fill:#fffaf0; stroke:#8c795a; stroke-width:1.5; rx:10; }
    </style>
  </defs>

  <rect width="1200" height="840" fill="url(#bg)"/>
  <text x="600" y="42" text-anchor="middle" class="title">河套历史地理骨架</text>
  <text x="600" y="69" text-anchor="middle" class="subtitle">黄河几字弯、阴山山口、灌溉平原、鄂尔多斯高原与交通节点关系示意；并非精确测绘或固定疆界图</text>

  <!-- surrounding regions -->
  <path d="M45 135 L265 95 L330 215 L250 335 L55 320 Z" fill="#ded6bd" stroke="#87765d" stroke-width="2"/>
  <text x="145" y="185" text-anchor="middle" class="region">贺兰山／阿拉善</text>
  <text x="145" y="212" text-anchor="middle" class="small">通往河西走廊</text>

  <path d="M35 460 L250 390 L340 665 L245 815 H35 Z" fill="#d9dfbd" stroke="#84936b" stroke-width="2"/>
  <text x="150" y="655" text-anchor="middle" class="region">宁夏平原／西套</text>
  <text x="150" y="682" text-anchor="middle" class="small">灵州—银川—贺兰山东麓</text>

  <path d="M805 110 L1165 100 L1170 355 L1030 420 L900 300 Z" fill="#d5dfbf" stroke="#80916b" stroke-width="2"/>
  <text x="1035" y="175" text-anchor="middle" class="region">蒙古高原南缘</text>
  <text x="1035" y="202" text-anchor="middle" class="small">北方草原与骑兵通道</text>

  <path d="M900 520 L1165 450 L1170 815 L880 810 L820 670 Z" fill="#d7dfc0" stroke="#81916d" stroke-width="2"/>
  <text x="1045" y="650" text-anchor="middle" class="region">晋北／华北方向</text>
  <text x="1045" y="677" text-anchor="middle" class="small">云中—代北—山西高原</text>

  <path d="M330 690 L820 650 L905 815 H275 Z" fill="#d8d2b7" stroke="#87785f" stroke-width="2"/>
  <text x="600" y="760" text-anchor="middle" class="region">陕北—关中方向</text>
  <text x="600" y="787" text-anchor="middle" class="small">无定河、窟野河等南向谷地连接关中北缘</text>

  <!-- Yinshan -->
  <path d="M275 185 l24-42 25 43 23-36 28 43 25-39 29 45 26-38 29 45 26-38 29 46 27-40 30 48 27-42 31 48 26-40 28 45 26-38 27 43 28-41 28 44 25-35 26 40 -20 29 -530 4z" class="mountain"/>
  <text x="585" y="128" text-anchor="middle" class="region">阴山山脉</text>
  <text x="585" y="155" text-anchor="middle" class="small">山体是屏障，山口是连接草原与河套的门</text>

  <!-- Houtao / Qiantao plains -->
  <path d="M270 240 C405 205 610 210 795 240 C870 252 940 278 990 315 L930 410 C805 367 650 350 485 360 C385 366 310 342 255 305 Z" fill="url(#plain)" stroke="#70884f" stroke-width="3"/>
  <text x="480" y="292" text-anchor="middle" class="region">后套平原</text>
  <text x="480" y="319" text-anchor="middle" class="small">引黄灌溉、屯田、渠道与城镇密集区</text>
  <text x="825" y="304" text-anchor="middle" class="region">前套／土默川</text>
  <text x="825" y="330" text-anchor="middle" class="small">包头—呼和浩特方向</text>

  <!-- Ordos plateau -->
  <path d="M300 390 C430 350 680 360 900 430 C930 520 900 650 815 710 C650 735 445 700 310 625 C255 545 260 455 300 390 Z" fill="url(#plateau)" stroke="#735f3d" stroke-width="3"/>
  <text x="620" y="485" text-anchor="middle" class="region">鄂尔多斯高原／秦汉“河南地”核心范围</text>
  <text x="620" y="512" text-anchor="middle" class="small">草原、台地、河谷、沙地与湖盆交错；不是均匀平原</text>

  <!-- deserts -->
  <path d="M360 398 C500 370 690 382 820 430 C765 470 620 485 475 467 C420 458 385 435 360 398 Z" fill="#d7bd7a" stroke="#aa8748" stroke-width="2"/>
  <path d="M360 398 C500 370 690 382 820 430 C765 470 620 485 475 467 C420 458 385 435 360 398 Z" fill="url(#sand)"/>
  <text x="600" y="426" text-anchor="middle" class="label">库布齐沙漠</text>

  <path d="M525 565 C650 530 805 560 850 645 C760 688 625 686 520 635 Z" fill="#d8bf80" stroke="#aa884b" stroke-width="2"/>
  <path d="M525 565 C650 530 805 560 850 645 C760 688 625 686 520 635 Z" fill="url(#sand)"/>
  <text x="690" y="618" text-anchor="middle" class="label">毛乌素沙地</text>

  <!-- Yellow River big loop -->
  <path class="river" d="M180 690 C210 610 245 515 285 405 C315 320 360 300 430 318 C560 350 720 340 865 375 C965 400 1010 455 990 535 C970 615 925 690 875 760"/>
  <text x="210" y="520" class="riverlabel" transform="rotate(-72 210 520)">黄河由宁夏北上</text>
  <text x="610" y="345" text-anchor="middle" class="riverlabel">黄河沿阴山南麓东流</text>
  <text x="1008" y="565" class="riverlabel" transform="rotate(72 1008 565)">托克托附近折向南</text>

  <!-- minor rivers south -->
  <path class="minorRiver" d="M525 650 C500 690 470 730 445 790"/>
  <text x="455" y="735" class="riverlabel" transform="rotate(-58 455 735)">无定河方向</text>
  <path class="minorRiver" d="M760 650 C790 700 820 745 845 790"/>
  <text x="805" y="727" class="riverlabel" transform="rotate(57 805 727)">窟野河方向</text>

  <!-- old wall systems -->
  <path class="wall" d="M320 218 C470 195 660 200 840 230"/>
  <text x="650" y="190" text-anchor="middle" class="small">赵—秦—汉北部塞垣大致方向（多时期、非同一条线）</text>
  <path class="wall" d="M405 650 C535 670 690 670 820 645"/>
  <text x="620" y="700" text-anchor="middle" class="small">明代延绥等内线长城方向（示意）</text>

  <!-- nodes and gates -->
  <g>
    <circle cx="405" cy="270" r="10" class="modern"/>
    <text x="405" y="252" text-anchor="middle" class="label">临河／巴彦淖尔</text>

    <circle cx="720" cy="320" r="10" class="major"/>
    <text x="720" y="300" text-anchor="middle" class="label">九原／包头方向</text>

    <circle cx="880" cy="345" r="10" class="major"/>
    <text x="895" y="330" class="label">云中／土默川</text>

    <circle cx="965" cy="470" r="10" class="major"/>
    <text x="990" y="452" class="label">胜州／托克托</text>

    <circle cx="330" cy="360" r="10" class="major"/>
    <text x="300" y="345" text-anchor="middle" class="label">朔方／五原区域</text>

    <circle cx="690" cy="635" r="10" class="major"/>
    <text x="690" y="665" text-anchor="middle" class="label">统万城</text>

    <rect x="405" y="176" width="18" height="18" rx="3" class="gate"/>
    <text x="414" y="168" text-anchor="middle" class="label">高阙塞方向</text>

    <rect x="315" y="185" width="18" height="18" rx="3" class="gate"/>
    <text x="280" y="180" text-anchor="middle" class="label">鸡鹿塞方向</text>

    <circle cx="300" cy="610" r="10" class="modern"/>
    <text x="285" y="640" text-anchor="middle" class="label">银川／灵州</text>

    <circle cx="575" cy="690" r="10" class="modern"/>
    <text x="575" y="720" text-anchor="middle" class="label">榆林方向</text>
  </g>

  <!-- strategic zones -->
  <ellipse cx="520" cy="335" rx="245" ry="95" fill="#517f62" fill-opacity=".08" stroke="#4e795f" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="490" y="378" text-anchor="middle" class="small">沿黄灌溉—郡县—军镇带</text>

  <ellipse cx="620" cy="520" rx="310" ry="175" fill="#a65a45" fill-opacity=".05" stroke="#9b5545" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="620" y="545" text-anchor="middle" class="small">黄河三面环绕的大弯内部：牧地、沙地与南向通道</text>

  <!-- routes -->
  <path class="route" d="M590 670 C565 725 520 765 470 808"/>
  <text x="485" y="755" class="small">南下陕北—关中</text>

  <path class="route" d="M300 590 C230 565 165 540 95 515"/>
  <text x="160" y="565" class="small">西连宁夏—河西</text>

  <path class="route" d="M940 470 C1010 465 1080 450 1140 415"/>
  <text x="1030" y="490" class="small">东接晋北—华北</text>

  <path class="route" d="M415 205 C430 150 470 115 505 88"/>
  <text x="470" y="104" class="small">越阴山至草原</text>

  <path class="route2" d="M720 318 C760 255 790 210 820 170"/>
  <path class="route2" d="M880 345 C920 280 945 235 980 190"/>

  <!-- legend -->
  <rect x="35" y="735" width="285" height="90" class="legend"/>
  <circle cx="58" cy="760" r="7" class="major"/>
  <text x="75" y="765" class="small">古代主要军政节点</text>
  <circle cx="190" cy="760" r="7" class="modern"/>
  <text x="207" y="765" class="small">现代参照城市</text>
  <rect x="51" y="781" width="14" height="14" rx="2" class="gate"/>
  <text x="75" y="793" class="small">山口／塞口</text>
  <line x1="180" y1="789" x2="220" y2="789" class="wall"/>
  <text x="230" y="793" class="small">长城／塞垣方向</text>
  <line x1="52" y1="813" x2="92" y2="813" class="route"/>
  <text x="105" y="817" class="small">主要交通与战略方向</text>

  <text x="1165" y="827" text-anchor="end" class="small">原创学习示意图 · 2026-07-30</text>
</svg>