<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">河西走廊历史地理骨架示意图</title>
  <desc id="desc">展示祁连山与北山夹持的河西走廊、石羊河黑河疏勒河水系、武威张掖酒泉敦煌绿洲、玉门关阳关嘉峪关及东西南北交通方向。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e5"/>
      <stop offset="1" stop-color="#e7dbc3"/>
    </linearGradient>
    <linearGradient id="oasis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe5ad"/>
      <stop offset="1" stop-color="#91bc72"/>
    </linearGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#88775d"/>
      <stop offset="1" stop-color="#b2a17d"/>
    </linearGradient>
    <pattern id="gobi" width="24" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="6" r="1.8" fill="#ac8956" opacity=".48"/>
      <circle cx="16" cy="13" r="1.5" fill="#937143" opacity=".42"/>
      <path d="M20 3 l3 2" stroke="#9c7a4a" stroke-width="1" opacity=".35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a482d"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2d78a2"/>
    </marker>
    <style>
      .title { font:700 30px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#392f25; }
      .subtitle { font:15px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#675848; }
      .region { font:700 20px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#47392d; }
      .label { font:600 15px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#302922; }
      .small { font:13px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#544a40; }
      .riverlabel { font:600 14px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill:#215f87; }
      .mountain { fill:url(#mount); stroke:#6e6049; stroke-width:1.5; }
      .river { fill:none; stroke:#4a91be; stroke-width:5; stroke-linecap:round; marker-end:url(#blueArrow); }
      .route { fill:none; stroke:#7a482d; stroke-width:4; stroke-dasharray:10 8; marker-end:url(#arrow); }
      .branch { fill:none; stroke:#9a683d; stroke-width:3; stroke-dasharray:7 7; marker-end:url(#arrow); }
      .wall { fill:none; stroke:#a04f42; stroke-width:3; stroke-dasharray:8 6; }
      .city { fill:#a84634; stroke:#fff8e9; stroke-width:3; }
      .town { fill:#6f472a; stroke:#fff8e9; stroke-width:3; }
      .gate { fill:#76509a; stroke:#fff8e9; stroke-width:3; }
      .post { fill:#2f6e55; stroke:#fff8e9; stroke-width:3; }
      .legend { fill:#fffaf0; stroke:#8d7a5d; stroke-width:1.5; rx:10; }
    </style>
  </defs>

  <rect width="1200" height="840" fill="url(#bg)"/>
  <text x="600" y="42" text-anchor="middle" class="title">河西走廊历史地理骨架</text>
  <text x="600" y="69" text-anchor="middle" class="subtitle">两山夹持、三河育绿洲、四郡串联与多方向交通示意；并非精确测绘或固定疆界图</text>

  <!-- outer regions -->
  <path d="M25 215 L185 145 L225 360 L145 535 L25 570 Z" fill="#d8d2b7" stroke="#86775d" stroke-width="2"/>
  <text x="95" y="295" text-anchor="middle" class="region">陇右／关中方向</text>
  <text x="95" y="322" text-anchor="middle" class="small">经兰州、乌鞘岭进入河西</text>

  <path d="M1010 180 L1180 120 L1180 540 L1040 600 L970 390 Z" fill="#d9d0b0" stroke="#8c7755" stroke-width="2"/>
  <text x="1095" y="300" text-anchor="middle" class="region">西域方向</text>
  <text x="1095" y="327" text-anchor="middle" class="small">哈密／塔里木盆地</text>
  <text x="1095" y="350" text-anchor="middle" class="small">通往中亚的多条路线</text>

  <path d="M300 650 L980 650 L1120 820 L210 820 Z" fill="#d5dac1" stroke="#81906d" stroke-width="2"/>
  <text x="650" y="775" text-anchor="middle" class="region">河湟—青藏高原方向</text>
  <text x="650" y="802" text-anchor="middle" class="small">经扁都口、当金山口等越过祁连山</text>

  <path d="M240 85 L1040 85 L1110 165 L180 165 Z" fill="#d7d1bc" stroke="#88785f" stroke-width="2"/>
  <text x="650" y="124" text-anchor="middle" class="region">北方戈壁—居延—蒙古高原方向</text>
  <text x="650" y="150" text-anchor="middle" class="small">并非无人区，存在绿洲、山口与季节性道路</text>

  <!-- north mountains -->
  <path d="M185 205 l26-35 25 38 28-42 29 43 28-38 27 42 30-44 30 46 28-40 30 44 29-42 31 45 28-38 30 42 28-39 31 42 28-36 30 39 29-42 31 44 26-37 31 41 28-35 30 37 26-31 30 33 -12 27 -825 3z" class="mountain"/>
  <text x="660" y="190" text-anchor="middle" class="label">北山系统：龙首山—合黎山—马鬃山及戈壁山地</text>

  <!-- Qilian mountains -->
  <path d="M160 625 l32-72 31 62 34-86 34 76 33-91 34 83 35-96 36 89 34-92 37 87 34-96 38 91 33-88 37 82 35-92 37 86 35-82 37 76 34-80 38 76 34-72 38 68 33-64 37 62 32-58 38 55 28-48 32 42 -12 39 -900 0z" class="mountain"/>
  <text x="630" y="605" text-anchor="middle" class="region">祁连山／走廊南山</text>
  <text x="630" y="632" text-anchor="middle" class="small">冰雪与降水形成内流河，是河西绿洲的主要水源</text>

  <!-- corridor base -->
  <path d="M150 300 C300 245 470 255 620 265 C770 275 900 260 1040 310 L1005 515 C845 545 675 530 520 525 C370 520 250 530 135 485 Z" fill="#d8bf86" stroke="#a17e48" stroke-width="3"/>
  <path d="M150 300 C300 245 470 255 620 265 C770 275 900 260 1040 310 L1005 515 C845 545 675 530 520 525 C370 520 250 530 135 485 Z" fill="url(#gobi)"/>
  <text x="590" y="385" text-anchor="middle" class="region">河西走廊：戈壁、冲积扇、河谷与绿洲相间</text>
  <text x="590" y="412" text-anchor="middle" class="small">道路依赖水源与补给节点，不是一条连续肥沃平原</text>

  <!-- oasis beads -->
  <ellipse cx="255" cy="395" rx="85" ry="70" fill="url(#oasis)" stroke="#68894f" stroke-width="3"/>
  <ellipse cx="465" cy="395" rx="102" ry="76" fill="url(#oasis)" stroke="#68894f" stroke-width="3"/>
  <ellipse cx="690" cy="405" rx="103" ry="77" fill="url(#oasis)" stroke="#68894f" stroke-width="3"/>
  <ellipse cx="900" cy="415" rx="104" ry="82" fill="url(#oasis)" stroke="#68894f" stroke-width="3"/>

  <text x="255" y="450" text-anchor="middle" class="small">石羊河绿洲</text>
  <text x="465" y="453" text-anchor="middle" class="small">黑河绿洲</text>
  <text x="690" y="465" text-anchor="middle" class="small">酒泉—嘉峪关绿洲</text>
  <text x="900" y="475" text-anchor="middle" class="small">瓜州—敦煌绿洲</text>

  <!-- rivers -->
  <path class="river" d="M265 585 C270 535 265 480 255 420 C248 365 248 330 245 300"/>
  <text x="287" y="525" class="riverlabel" transform="rotate(-83 287 525)">石羊河水系</text>

  <path class="river" d="M480 590 C485 525 478 475 465 410 C455 355 450 300 445 245"/>
  <text x="508" y="522" class="riverlabel" transform="rotate(-82 508 522)">黑河水系</text>
  <path class="river" d="M445 245 C480 205 505 170 525 138"/>
  <text x="505" y="210" class="riverlabel" transform="rotate(-52 505 210)">通向居延</text>

  <path class="river" d="M855 590 C850 535 865 485 900 430 C925 390 940 340 950 290"/>
  <text x="885" y="550" class="riverlabel" transform="rotate(-63 885 550)">疏勒河水系</text>

  <!-- main route -->
  <path class="route" d="M75 405 C145 385 190 380 245 380 C330 375 390 380 465 385 C560 390 615 390 690 395 C780 400 825 400 900 405 C975 410 1040 395 1125 360"/>
  <text x="600" y="350" text-anchor="middle" class="label">东西主干道：关陇—凉州—甘州—肃州—瓜沙—西域</text>

  <!-- branch routes -->
  <path class="branch" d="M465 420 C455 505 430 590 405 710"/>
  <text x="397" y="560" class="small" transform="rotate(-72 397 560)">扁都口—河湟</text>

  <path class="branch" d="M900 430 C940 520 980 600 1030 710"/>
  <text x="985" y="565" class="small" transform="rotate(63 985 565)">当金山口—柴达木</text>

  <path class="branch" d="M465 365 C500 300 515 235 525 150"/>
  <text x="545" y="270" class="small" transform="rotate(-75 545 270)">黑河—居延</text>

  <!-- wall / beacon line -->
  <path class="wall" d="M680 315 C760 300 835 302 930 320 C980 330 1015 335 1055 330"/>
  <text x="865" y="295" text-anchor="middle" class="small">汉代塞垣、亭障与烽燧大致方向（多时期示意）</text>

  <!-- cities -->
  <g>
    <circle cx="250" cy="380" r="12" class="city"/>
    <text x="250" y="355" text-anchor="middle" class="label">武威／凉州／姑臧</text>

    <circle cx="465" cy="385" r="12" class="city"/>
    <text x="465" y="360" text-anchor="middle" class="label">张掖／甘州</text>

    <circle cx="675" cy="395" r="12" class="city"/>
    <text x="675" y="370" text-anchor="middle" class="label">酒泉／肃州</text>

    <rect x="725" y="385" width="22" height="22" rx="3" class="gate"/>
    <text x="736" y="430" text-anchor="middle" class="label">嘉峪关（明）</text>

    <circle cx="850" cy="410" r="10" class="town"/>
    <text x="850" y="385" text-anchor="middle" class="label">瓜州</text>

    <circle cx="930" cy="415" r="12" class="city"/>
    <text x="930" y="390" text-anchor="middle" class="label">敦煌／沙州</text>

    <rect x="1000" y="350" width="21" height="21" rx="3" class="gate"/>
    <text x="1010" y="340" text-anchor="middle" class="label">玉门关</text>

    <rect x="990" y="450" width="21" height="21" rx="3" class="gate"/>
    <text x="1000" y="495" text-anchor="middle" class="label">阳关</text>

    <circle cx="885" cy="365" r="9" class="post"/>
    <text x="885" y="345" text-anchor="middle" class="small">悬泉置</text>

    <circle cx="525" cy="170" r="9" class="post"/>
    <text x="555" y="170" class="small">居延方向</text>

    <circle cx="170" cy="380" r="9" class="town"/>
    <text x="170" y="355" text-anchor="middle" class="small">乌鞘岭门户</text>
  </g>

  <!-- strategic brackets -->
  <path d="M175 505 C320 555 510 555 640 520" fill="none" stroke="#4e785d" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="405" y="570" text-anchor="middle" class="small">河西东—中部：人口、粮源与调度中心</text>

  <path d="M640 520 C775 560 930 555 1015 505" fill="none" stroke="#76509a" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="835" y="583" text-anchor="middle" class="small">河西西部：关隘、外交接待与出西域前沿</text>

  <!-- legend -->
  <rect x="35" y="650" width="330" height="150" class="legend"/>
  <text x="55" y="680" class="label">图例</text>
  <circle cx="65" cy="710" r="9" class="city"/>
  <text x="85" y="715" class="small">主要绿洲城市／郡州治所</text>
  <rect x="56" y="730" width="18" height="18" rx="3" class="gate"/>
  <text x="85" y="744" class="small">关隘</text>
  <circle cx="65" cy="772" r="8" class="post"/>
  <text x="85" y="777" class="small">驿置或交通节点</text>
  <path d="M215 705 h70" class="route"/>
  <text x="215" y="728" class="small">东西主路</text>
  <path d="M215 755 h70" class="river"/>
  <text x="215" y="782" class="small">祁连山融雪水系</text>

  <rect x="815" y="665" width="350" height="125" class="legend"/>
  <text x="990" y="695" text-anchor="middle" class="label">读图要点</text>
  <text x="835" y="724" class="small">1. 河西是绿洲节点网络，不是连续耕地。</text>
  <text x="835" y="750" class="small">2. 水源决定城市，驿路连接城市，关塞管理流动。</text>
  <text x="835" y="776" class="small">3. 东西主轴之外，南北通道同样影响战争与交流。</text>
</svg>
