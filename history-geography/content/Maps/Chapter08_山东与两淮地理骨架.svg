<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">山东与两淮历史地理骨架示意图</title>
  <desc id="desc">展示鲁中山地、齐鲁区域、胶东半岛、黄河、淮河、大运河、徐州、淮安、扬州及主要交通方向的原创示意图。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7a4b20"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
    <style>
      .land { fill:#f6edd8; stroke:#8b795e; stroke-width:2; }
      .plain { fill:#dfeccf; stroke:#8aa06f; stroke-width:1.5; }
      .mountain { fill:#c9b38a; stroke:#806b49; stroke-width:2; }
      .water { fill:none; stroke:#2d7fb8; stroke-width:8; stroke-linecap:round; }
      .canal { fill:none; stroke:#7c5aa6; stroke-width:6; stroke-dasharray:14 10; stroke-linecap:round; }
      .route { fill:none; stroke:#7a4b20; stroke-width:4; stroke-dasharray:9 8; marker-end:url(#arrow); }
      .city { fill:#9d2f2f; stroke:white; stroke-width:2; }
      .hub { fill:#c66a19; stroke:white; stroke-width:3; }
      .label { font-family:"Noto Sans SC","Microsoft YaHei",sans-serif; font-size:24px; fill:#2f2a22; }
      .small { font-size:19px; }
      .tiny { font-size:16px; }
      .title { font-size:38px; font-weight:700; }
      .subtitle { font-size:20px; fill:#5d5144; }
      .region { font-size:28px; font-weight:700; fill:#5f4b35; }
      .waterlabel { fill:#1f6391; font-weight:700; }
      .box { fill:#fffaf0; stroke:#9d8d73; stroke-width:1.5; rx:12; filter:url(#shadow); }
    </style>
  </defs>

  <rect width="1400" height="980" fill="#fbf8f1"/>
  <text x="700" y="52" text-anchor="middle" class="label title">山东与两淮历史地理骨架</text>
  <text x="700" y="86" text-anchor="middle" class="label subtitle">山地分隔的齐鲁网络 · 黄淮与运河连接的南北接口</text>

  <!-- Land masses -->
  <path class="land" d="M170,150 C330,100 560,105 760,150 C900,180 1020,145 1160,190 C1250,220 1300,300 1250,360 C1205,415 1110,440 1010,430 C930,422 865,455 790,500 C665,575 510,580 375,530 C250,485 145,395 120,285 C105,220 120,175 170,150 Z"/>
  <path class="plain" d="M160,175 C360,125 520,135 665,170 C740,190 790,230 775,295 C760,360 690,405 610,425 C490,455 330,420 220,360 C155,325 120,250 160,175 Z" opacity="0.92"/>
  <path class="land" d="M310,500 C470,455 690,480 850,525 C990,565 1115,610 1195,705 C1245,765 1215,850 1125,880 C980,930 790,885 650,850 C505,815 335,835 225,770 C135,715 155,620 225,555 C250,530 278,512 310,500 Z"/>
  <path class="plain" d="M245,535 C400,500 610,520 770,565 C850,590 905,650 875,720 C835,805 680,820 520,795 C355,770 225,735 205,665 C188,605 205,560 245,535 Z" opacity="0.9"/>

  <!-- Shandong peninsula -->
  <path class="land" d="M790,205 C915,170 1050,170 1185,205 C1260,225 1325,285 1315,330 C1300,390 1210,410 1110,392 C1000,370 920,345 810,365 C770,372 745,320 758,270 C765,240 775,218 790,205 Z"/>

  <!-- Mountains -->
  <path class="mountain" d="M455,250 L505,190 L555,255 L600,210 L650,285 L610,345 L545,328 L495,370 L430,320 Z"/>
  <text x="545" y="282" text-anchor="middle" class="label region">鲁中山地</text>
  <text x="540" y="312" text-anchor="middle" class="label small">泰山 · 沂山 · 蒙山</text>

  <!-- Water -->
  <path class="water" d="M120,185 C250,185 355,205 455,198 C590,190 690,175 805,188 C925,200 1015,205 1125,190"/>
  <text x="320" y="168" class="label waterlabel">黄河下游</text>

  <path class="water" d="M145,640 C300,625 430,655 570,650 C720,645 845,675 970,690 C1060,700 1155,705 1260,700"/>
  <text x="305" y="614" class="label waterlabel">淮河</text>

  <path class="water" d="M235,810 C430,790 620,825 805,830 C980,835 1120,825 1290,845"/>
  <text x="1030" y="874" class="label waterlabel">长江</text>

  <ellipse cx="820" cy="705" rx="98" ry="52" fill="#8dc7e8" stroke="#2d7fb8" stroke-width="3"/>
  <text x="820" y="712" text-anchor="middle" class="label small waterlabel">洪泽湖</text>

  <!-- Canal -->
  <path class="canal" d="M275,140 C300,235 325,330 350,430 C375,520 415,590 505,655 C610,730 705,790 815,855"/>
  <text x="360" y="455" class="label small" fill="#674487">京杭大运河</text>

  <!-- Regions -->
  <text x="290" y="250" text-anchor="middle" class="label region">齐地</text>
  <text x="520" y="425" text-anchor="middle" class="label region">鲁地</text>
  <text x="1040" y="290" text-anchor="middle" class="label region">胶东半岛</text>
  <text x="640" y="610" text-anchor="middle" class="label region">黄淮平原</text>
  <text x="960" y="770" text-anchor="middle" class="label region">两淮与江淮</text>

  <!-- Cities -->
  <circle cx="360" cy="265" r="10" class="city"/>
  <text x="378" y="272" class="label small">临淄</text>
  <circle cx="300" cy="210" r="9" class="city"/>
  <text x="316" y="218" class="label small">济南</text>
  <circle cx="505" cy="395" r="10" class="city"/>
  <text x="523" y="402" class="label small">曲阜</text>
  <circle cx="410" cy="470" r="9" class="city"/>
  <text x="428" y="478" class="label small">济宁</text>
  <circle cx="285" cy="130" r="9" class="city"/>
  <text x="303" y="138" class="label small">临清</text>
  <circle cx="1080" cy="290" r="9" class="city"/>
  <text x="1098" y="298" class="label small">登州</text>
  <circle cx="1030" cy="365" r="9" class="city"/>
  <text x="1048" y="373" class="label small">胶州湾</text>
  <circle cx="500" cy="585" r="12" class="hub"/>
  <text x="520" y="592" class="label small">徐州／彭城</text>
  <circle cx="790" cy="660" r="12" class="hub"/>
  <text x="808" y="642" class="label small">淮安／清口</text>
  <circle cx="820" cy="830" r="12" class="hub"/>
  <text x="840" y="837" class="label small">扬州</text>
  <circle cx="610" cy="670" r="9" class="city"/>
  <text x="628" y="678" class="label small">泗州</text>
  <circle cx="495" cy="700" r="9" class="city"/>
  <text x="513" y="708" class="label small">寿春</text>

  <!-- Routes -->
  <path class="route" d="M360,275 C410,360 455,470 500,575"/>
  <path class="route" d="M500,600 C600,620 690,640 780,660"/>
  <path class="route" d="M795,675 C810,730 815,780 820,818"/>
  <path class="route" d="M1040,355 C940,430 825,490 700,545"/>
  <path class="route" d="M500,585 C385,565 270,555 155,570"/>
  <text x="176" y="548" class="label tiny">向中原</text>
  <path class="route" d="M820,830 C950,835 1080,840 1230,845"/>
  <text x="1125" y="815" class="label tiny">向江南与东海</text>

  <!-- Explanatory boxes -->
  <rect x="930" y="470" width="380" height="150" class="box"/>
  <text x="955" y="505" class="label small" font-weight="700">两种空间逻辑</text>
  <text x="955" y="540" class="label tiny">山东：山地分隔下的多中心网络</text>
  <text x="955" y="570" class="label tiny">两淮：河流、运河与长江之间的接口</text>
  <text x="955" y="600" class="label tiny">统一时组织财政，分裂时形成前沿</text>

  <rect x="60" y="850" width="535" height="90" class="box"/>
  <text x="85" y="885" class="label small" font-weight="700">图例</text>
  <circle cx="95" cy="915" r="8" class="city"/><text x="112" y="922" class="label tiny">城市</text>
  <circle cx="205" cy="915" r="10" class="hub"/><text x="225" y="922" class="label tiny">关键枢纽</text>
  <line x1="355" y1="915" x2="410" y2="915" class="water"/><text x="425" y="922" class="label tiny">河流</text>
  <line x1="500" y1="915" x2="555" y2="915" class="canal"/><text x="570" y="922" class="label tiny">运河</text>

  <text x="1340" y="948" text-anchor="end" class="label tiny" fill="#6d6254">原创示意图｜非精确测绘地图</text>
</svg>