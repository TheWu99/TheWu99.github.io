<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">燕赵地理骨架与历史通道示意图</title>
  <desc id="desc">展示太行山、燕山、坝上高原、河北平原、渤海、辽西走廊、主要河流、城市、关隘与战略交通方向。该图为原创历史地理示意图，不是精确测绘地图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f3e5"/>
      <stop offset="1" stop-color="#efe3c8"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a28b64" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#6f5d40" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d89d" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#d7c27d" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d8e8"/>
      <stop offset="1" stop-color="#6eb4d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4e4635" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9a4e32"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2e6f9e"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2f2b23; }
      .tiny { font-size: 14px; }
      .small { font-size: 17px; }
      .medium { font-size: 21px; font-weight: 650; }
      .large { font-size: 30px; font-weight: 750; }
      .city { fill: #9a3f2f; stroke: #fff8e8; stroke-width: 3; }
      .pass { fill: #27231c; stroke: #fff8e8; stroke-width: 2; }
      .river { fill: none; stroke: #2e7eb2; stroke-width: 6; stroke-linecap: round; }
      .minor-river { fill: none; stroke: #5ba2c8; stroke-width: 4; stroke-linecap: round; }
      .route { fill: none; stroke: #9a4e32; stroke-width: 5; stroke-dasharray: 12 8; marker-end: url(#arrow); }
      .wall { fill: none; stroke: #6b4d37; stroke-width: 6; stroke-dasharray: 16 7; }
      .zone { fill: none; stroke: #6e624b; stroke-width: 3; stroke-dasharray: 9 6; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" class="label large">燕赵地理骨架与历史通道</text>
  <text x="600" y="79" text-anchor="middle" class="label small">太行山—燕山—河北平原—渤海｜示意图，非精确测绘</text>

  <!-- compass -->
  <g transform="translate(1090,118)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="35" fill="#fffaf0" stroke="#6a5f49" stroke-width="2"/>
    <path d="M0,-27 L8,4 L0,0 L-8,4 Z" fill="#9a3f2f"/>
    <path d="M0,27 L8,-4 L0,0 L-8,-4 Z" fill="#5b6570"/>
    <text x="0" y="-42" text-anchor="middle" class="label medium">北</text>
  </g>

  <!-- schematic regional envelope -->
  <path d="M315,125 C440,80 675,80 860,130 C970,160 1030,250 1038,360 C1046,480 1008,620 923,740 C835,858 625,850 455,810 C345,785 260,690 235,560 C215,450 235,325 250,230 C260,175 280,145 315,125 Z" fill="#f5edd8" stroke="#6f634c" stroke-width="4" filter="url(#shadow)"/>

  <!-- Bohai Sea -->
  <path d="M900,240 C1000,250 1085,305 1148,390 L1148,780 C1078,792 997,765 925,715 C962,620 972,520 958,430 C948,355 925,296 900,240 Z" fill="url(#sea)" stroke="#4f92ad" stroke-width="3"/>
  <text x="1065" y="515" text-anchor="middle" class="label large" fill="#245f78">渤海</text>
  <text x="1060" y="545" text-anchor="middle" class="label small" fill="#245f78">海运·盐业·港口</text>

  <!-- Taihang Mountains -->
  <path d="M300,180 C335,235 318,300 350,365 C375,420 360,490 390,555 C420,625 410,710 460,790 L530,760 C490,695 485,620 462,550 C440,480 455,410 425,350 C397,293 412,230 380,160 Z" fill="url(#mountain)" opacity="0.88"/>
  <text x="392" y="500" transform="rotate(-77 392 500)" class="label medium" fill="#fffaf0">太行山脉</text>

  <!-- Yanshan Mountains -->
  <path d="M430,160 C520,105 670,102 800,135 C865,152 910,183 942,230 L900,292 C840,258 775,248 700,252 C620,256 555,247 495,265 L430,230 Z" fill="url(#mountain)" opacity="0.9"/>
  <text x="690" y="186" text-anchor="middle" class="label medium" fill="#fffaf0">燕山山脉</text>

  <!-- Bashang plateau -->
  <path d="M415,105 C520,72 710,66 850,100 L800,140 C680,113 548,118 450,155 Z" fill="#bda77a" opacity="0.72" stroke="#8d7751" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="630" y="105" text-anchor="middle" class="label medium">坝上高原／草原南缘</text>

  <!-- North China Plain -->
  <path d="M485,270 C620,245 800,258 920,320 C965,390 958,520 920,690 C860,790 690,818 520,765 C480,675 458,580 465,480 C470,390 470,320 485,270 Z" fill="url(#plain)" stroke="#b49b52" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="720" y="510" text-anchor="middle" class="label large" fill="#71602f">河北平原</text>
  <text x="720" y="540" text-anchor="middle" class="label small" fill="#71602f">农业·城市·军队展开空间</text>

  <!-- Liaoxi corridor -->
  <path d="M900,265 C955,250 1015,250 1088,275" class="route"/>
  <text x="1000" y="232" text-anchor="middle" class="label medium" fill="#8b432e">辽西走廊 → 东北</text>

  <!-- Great Wall -->
  <path d="M365,145 C450,120 520,125 590,132 C675,140 760,130 842,165 C900,188 935,215 972,255" class="wall"/>
  <text x="715" y="120" text-anchor="middle" class="label small">长城与北部关塞体系</text>

  <!-- rivers -->
  <path d="M510,300 C555,350 610,390 675,425 C735,458 790,505 830,565 C858,610 875,670 900,720" class="river"/>
  <text x="780" y="505" transform="rotate(42 780 505)" class="label medium" fill="#1e668f">海河水系</text>

  <path d="M470,355 C535,370 590,390 650,420" class="minor-river"/>
  <text x="515" y="345" class="label small" fill="#2e7eb2">拒马河</text>

  <path d="M445,425 C520,438 590,462 660,495" class="minor-river"/>
  <text x="500" y="420" class="label small" fill="#2e7eb2">易水</text>

  <path d="M430,590 C510,560 600,565 690,610 C750,638 805,690 860,745" class="river"/>
  <text x="555" y="560" class="label medium" fill="#1e668f">滹沱河</text>

  <path d="M420,730 C505,690 610,690 720,735 C785,762 835,790 885,805" class="minor-river"/>
  <text x="535" y="700" class="label medium" fill="#2e7eb2">漳河</text>

  <path d="M865,305 C920,360 940,415 945,480" class="minor-river"/>
  <text x="930" y="365" class="label small" fill="#2e7eb2">滦河</text>

  <!-- Grand Canal -->
  <path d="M845,740 C820,670 805,610 825,555 C845,500 855,445 840,390" fill="none" stroke="#6d63a8" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#blueArrow)"/>
  <text x="875" y="620" transform="rotate(-78 875 620)" class="label medium" fill="#5e5598">大运河／南北粮运</text>

  <!-- cities -->
  <g>
    <circle cx="700" cy="330" r="10" class="city"/><text x="715" y="338" class="label medium">蓟城／幽州／北京</text>
    <circle cx="800" cy="470" r="9" class="city"/><text x="815" y="478" class="label medium">天津／直沽</text>
    <circle cx="845" cy="300" r="8" class="city"/><text x="860" y="308" class="label medium">蓟州</text>
    <circle cx="955" cy="280" r="9" class="city"/><text x="970" y="288" class="label medium">山海关</text>
    <circle cx="585" cy="500" r="9" class="city"/><text x="600" y="508" class="label medium">燕下都／易县</text>
    <circle cx="690" cy="610" r="9" class="city"/><text x="705" y="618" class="label medium">真定／正定</text>
    <circle cx="605" cy="690" r="9" class="city"/><text x="620" y="698" class="label medium">中山／定州</text>
    <circle cx="655" cy="785" r="10" class="city"/><text x="670" y="793" class="label medium">邯郸</text>
    <circle cx="760" cy="810" r="8" class="city"/><text x="775" y="818" class="label medium">邺城</text>
    <circle cx="535" cy="235" r="8" class="city"/><text x="550" y="243" class="label medium">宣化／张家口</text>
    <circle cx="380" cy="350" r="8" class="city"/><text x="290" y="345" class="label medium">代地／蔚州</text>
  </g>

  <!-- passes -->
  <g>
    <rect x="638" y="235" width="14" height="14" transform="rotate(45 645 242)" class="pass"/>
    <text x="610" y="222" class="label medium">居庸关</text>

    <rect x="790" y="215" width="14" height="14" transform="rotate(45 797 222)" class="pass"/>
    <text x="812" y="226" class="label medium">古北口</text>

    <rect x="947" y="268" width="14" height="14" transform="rotate(45 954 275)" class="pass"/>
    <text x="970" y="265" class="label small">山海关</text>

    <rect x="425" y="535" width="14" height="14" transform="rotate(45 432 542)" class="pass"/>
    <text x="330" y="540" class="label medium">紫荆关</text>

    <rect x="435" y="620" width="14" height="14" transform="rotate(45 442 627)" class="pass"/>
    <text x="350" y="625" class="label medium">井陉</text>

    <rect x="390" y="410" width="14" height="14" transform="rotate(45 397 417)" class="pass"/>
    <text x="300" y="412" class="label small">飞狐道</text>
  </g>

  <!-- strategic routes -->
  <path d="M650,245 C620,195 590,155 550,115" class="route"/>
  <text x="470" y="165" class="label medium" fill="#8b432e">向草原与代北</text>

  <path d="M954,275 C1005,270 1055,275 1100,295" class="route"/>

  <path d="M700,330 C710,430 700,540 690,610 C680,690 670,745 655,785" class="route"/>
  <text x="730" y="680" class="label small" fill="#8b432e">华北平原南北主轴</text>

  <path d="M440,625 C385,625 330,615 270,600" class="route"/>
  <text x="145" y="595" class="label medium" fill="#8b432e">越太行至晋阳</text>

  <path d="M430,542 C370,530 320,510 260,480" class="route"/>
  <text x="155" y="465" class="label medium" fill="#8b432e">太行山口</text>

  <path d="M800,470 C875,500 930,540 990,590" class="route"/>
  <text x="980" y="625" text-anchor="middle" class="label medium" fill="#8b432e">渤海港口与海运</text>

  <!-- historic zones -->
  <path d="M520,270 C610,235 755,240 865,300 C850,390 790,435 700,445 C610,452 545,405 520,270 Z" class="zone"/>
  <text x="680" y="395" text-anchor="middle" class="label large" fill="#7a3f32">燕国核心区</text>

  <path d="M470,500 C540,470 685,495 775,575 C790,665 742,760 660,810 C565,790 500,720 465,640 C450,590 450,540 470,500 Z" class="zone"/>
  <text x="625" y="655" text-anchor="middle" class="label large" fill="#7a3f32">赵国东部核心区</text>

  <!-- context labels -->
  <text x="170" y="280" class="label large" fill="#75684f">山西高地</text>
  <text x="155" y="315" class="label small" fill="#75684f">晋阳·上党方向</text>
  <text x="820" y="855" class="label large" fill="#75684f">河南／中原方向</text>
  <text x="1025" y="175" class="label medium" fill="#75684f">承德／辽西方向</text>

  <!-- legend -->
  <g transform="translate(50,730)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="142" rx="12" fill="#fffaf0" stroke="#7a6d53" stroke-width="2"/>
    <text x="18" y="28" class="label medium">图例</text>
    <circle cx="28" cy="54" r="7" class="city"/><text x="48" y="61" class="label small">历史城市／节点</text>
    <rect x="21" y="76" width="14" height="14" transform="rotate(45 28 83)" class="pass"/><text x="48" y="89" class="label small">关隘／山口</text>
    <line x1="18" y1="109" x2="62" y2="109" class="route"/><text x="76" y="115" class="label small">主要战略通道</text>
    <line x1="190" y1="54" x2="235" y2="54" class="river"/><text x="245" y="61" class="label small">河流</text>
    <line x1="190" y1="84" x2="235" y2="84" class="wall"/><text x="245" y="90" class="label small">长城体系</text>
    <rect x="190" y="103" width="42" height="22" fill="url(#plain)" stroke="#b49b52"/><text x="245" y="120" class="label small">平原</text>
  </g>

  <text x="600" y="884" text-anchor="middle" class="label tiny">原创历史地理示意图｜强调相对方位与网络关系，不用于精确边界或距离测量</text>
</svg>