<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">衣冠南渡与江南地理骨架示意图</title>
  <desc id="desc">展示中原、淮河、长江、建康、太湖、三吴、荆州及北方人口南迁和南朝防御层次的原创示意图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f3e8"/>
      <stop offset="100%" stop-color="#e8f2e6"/>
    </linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dcefc7"/>
      <stop offset="100%" stop-color="#c7e5aa"/>
    </linearGradient>
    <pattern id="hills" width="32" height="22" patternUnits="userSpaceOnUse">
      <path d="M2 20 L11 6 L20 20 M14 20 L23 8 L31 20" fill="none" stroke="#87a16d" stroke-width="2" opacity="0.6"/>
    </pattern>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c96f3b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2d6f9f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3d4a45" flood-opacity="0.2"/>
    </filter>
    <style>
      .title { font: 700 34px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#203b35; }
      .subtitle { font: 18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#52645f; }
      .region { font: 700 24px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#38523d; }
      .city { font: 700 18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#243c46; }
      .small { font: 16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#42555d; }
      .riverLabel { font: 700 18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#21658f; }
      .note { font: 15px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#5c6864; }
      .legend { font: 16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#344943; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" class="title">衣冠南渡与江南地理骨架</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">北方移民、长江防线、建康首都与三吴财赋网络（原创示意，非精确测绘）</text>

  <path d="M40 110 H1160 V275 C980 250 800 265 630 250 C450 235 260 255 40 230 Z" fill="#ead9bd" opacity="0.85"/>
  <text x="190" y="155" class="region">中原与北方</text>
  <text x="190" y="184" class="small">洛阳、豫州、徐州等人口外迁来源区</text>

  <path d="M55 290 C260 265 450 285 620 275 C790 265 980 280 1145 255 L1145 405 C930 390 780 410 600 395 C410 380 240 405 55 380 Z" fill="#f0e5c9" opacity="0.9"/>
  <text x="85" y="335" class="region">淮南缓冲区</text>

  <path d="M50 470 C260 425 460 455 640 440 C830 425 1010 445 1150 410 L1150 755 H50 Z" fill="url(#plain)" opacity="0.95"/>
  <text x="930" y="715" class="region">江南核心区</text>

  <path d="M70 625 C210 540 355 565 470 615 C595 670 700 625 800 585 C900 545 1020 570 1145 640 L1145 770 H70 Z" fill="url(#hills)" opacity="0.9"/>
  <text x="115" y="690" class="small">江南丘陵与山地</text>

  <path d="M60 355 C230 330 365 370 515 345 C670 320 805 365 945 335 C1035 318 1090 330 1150 315" fill="none" stroke="#4b99c5" stroke-width="8" stroke-linecap="round"/>
  <text x="565" y="325" class="riverLabel">淮河：外层前沿与缓冲</text>

  <path d="M45 485 C170 455 275 500 405 475 C545 448 665 500 805 470 C945 440 1045 475 1160 440" fill="none" stroke="#2d80b7" stroke-width="18" stroke-linecap="round"/>
  <path d="M45 485 C170 455 275 500 405 475 C545 448 665 500 805 470 C945 440 1045 475 1160 440" fill="none" stroke="#8fd0eb" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <text x="600" y="430" text-anchor="middle" class="riverLabel">长江：核心防线与东西运输轴</text>

  <ellipse cx="880" cy="585" rx="78" ry="44" fill="#9fd6e8" stroke="#4c9abb" stroke-width="3"/>
  <text x="880" y="592" text-anchor="middle" class="riverLabel">太湖</text>
  <ellipse cx="420" cy="600" rx="48" ry="35" fill="#a9dbea" stroke="#4c9abb" stroke-width="3"/>
  <text x="420" y="607" text-anchor="middle" class="small">鄱阳湖</text>

  <path d="M705 480 C720 525 755 555 815 574" fill="none" stroke="#4b99c5" stroke-width="5"/>
  <path d="M805 574 C760 610 715 625 655 630" fill="none" stroke="#4b99c5" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M465 485 C450 525 438 560 420 600" fill="none" stroke="#4b99c5" stroke-width="5"/>

  <g filter="url(#shadow)">
    <circle cx="265" cy="205" r="9" fill="#9c4f3f"/>
    <rect x="282" y="182" width="128" height="48" rx="10" fill="#fffaf0" stroke="#b98a65"/>
    <text x="346" y="212" text-anchor="middle" class="city">洛阳／中原</text>

    <circle cx="775" cy="300" r="9" fill="#9c4f3f"/>
    <rect x="792" y="277" width="92" height="46" rx="10" fill="#fffaf0" stroke="#b98a65"/>
    <text x="838" y="307" text-anchor="middle" class="city">广陵</text>

    <circle cx="815" cy="455" r="11" fill="#b83d42"/>
    <rect x="832" y="418" width="128" height="57" rx="12" fill="#fff9e8" stroke="#bd7659" stroke-width="2"/>
    <text x="896" y="442" text-anchor="middle" class="city">建康</text>
    <text x="896" y="464" text-anchor="middle" class="small">六朝首都</text>

    <circle cx="930" cy="450" r="9" fill="#9c4f3f"/>
    <rect x="948" y="420" width="92" height="46" rx="10" fill="#fffaf0" stroke="#b98a65"/>
    <text x="994" y="450" text-anchor="middle" class="city">京口</text>

    <circle cx="1005" cy="610" r="9" fill="#5f7d45"/>
    <rect x="1022" y="586" width="92" height="46" rx="10" fill="#f8ffed" stroke="#8aaa6b"/>
    <text x="1068" y="616" text-anchor="middle" class="city">吴郡</text>

    <circle cx="910" cy="685" r="9" fill="#5f7d45"/>
    <rect x="925" y="660" width="92" height="46" rx="10" fill="#f8ffed" stroke="#8aaa6b"/>
    <text x="971" y="690" text-anchor="middle" class="city">会稽</text>

    <circle cx="610" cy="500" r="9" fill="#9c4f3f"/>
    <rect x="625" y="488" width="90" height="44" rx="10" fill="#fffaf0" stroke="#b98a65"/>
    <text x="670" y="517" text-anchor="middle" class="city">姑孰</text>

    <circle cx="455" cy="500" r="9" fill="#9c4f3f"/>
    <rect x="470" y="486" width="90" height="44" rx="10" fill="#fffaf0" stroke="#b98a65"/>
    <text x="515" y="515" text-anchor="middle" class="city">寻阳</text>

    <circle cx="235" cy="485" r="9" fill="#9c4f3f"/>
    <rect x="145" y="510" width="180" height="48" rx="10" fill="#fffaf0" stroke="#b98a65"/>
    <text x="235" y="540" text-anchor="middle" class="city">荆州／江陵</text>

    <circle cx="145" cy="355" r="9" fill="#9c4f3f"/>
    <rect x="80" y="374" width="130" height="46" rx="10" fill="#fffaf0" stroke="#b98a65"/>
    <text x="145" y="403" text-anchor="middle" class="city">襄阳</text>
  </g>

  <path d="M330 220 C450 250 600 255 760 300" fill="none" stroke="#c96f3b" stroke-width="6" stroke-dasharray="12 9" marker-end="url(#arrowOrange)"/>
  <path d="M775 318 C795 355 805 390 815 440" fill="none" stroke="#c96f3b" stroke-width="6" stroke-dasharray="12 9" marker-end="url(#arrowOrange)"/>
  <path d="M300 225 C230 270 180 310 150 345" fill="none" stroke="#c96f3b" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowOrange)"/>
  <path d="M155 365 C175 420 200 455 225 476" fill="none" stroke="#c96f3b" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowOrange)"/>
  <text x="490" y="255" class="small" fill="#a7552f">北方人口南迁主方向（示意）</text>

  <path d="M275 485 C420 455 575 485 798 458" fill="none" stroke="#2d6f9f" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="500" y="455" class="small" fill="#2d6f9f">上游军镇与建康联系</text>
  <path d="M995 598 C955 560 905 520 835 472" fill="none" stroke="#5f8e43" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M910 670 C880 610 855 545 825 474" fill="none" stroke="#5f8e43" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="965" y="545" class="small" fill="#4b7437">三吴财赋与水运</text>

  <rect x="45" y="275" width="1110" height="130" rx="18" fill="none" stroke="#b78d52" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="45" y="420" width="1110" height="95" rx="18" fill="none" stroke="#377e9f" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1085" y="296" text-anchor="end" class="note">第一层：淮南前沿</text>
  <text x="1085" y="510" text-anchor="end" class="note">第二层：长江防线</text>

  <g transform="translate(60,742)">
    <rect x="0" y="0" width="1080" height="58" rx="14" fill="#ffffff" opacity="0.82" stroke="#c8d0c9"/>
    <line x1="28" y1="20" x2="88" y2="20" stroke="#c96f3b" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#arrowOrange)"/>
    <text x="102" y="26" class="legend">人口南迁</text>
    <line x1="245" y1="20" x2="305" y2="20" stroke="#2d6f9f" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <text x="320" y="26" class="legend">军事／运输联系</text>
    <ellipse cx="550" cy="20" rx="30" ry="13" fill="#9fd6e8" stroke="#4c9abb" stroke-width="2"/>
    <text x="595" y="26" class="legend">湖泊与水网</text>
    <rect x="770" y="8" width="45" height="24" fill="url(#hills)" stroke="#87a16d"/>
    <text x="830" y="26" class="legend">丘陵山地</text>
    <text x="1005" y="26" class="note">方位与关系示意</text>
  </g>
</svg>
