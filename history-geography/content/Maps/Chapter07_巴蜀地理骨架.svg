<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">巴蜀地理骨架与对外通道</title>
  <desc id="desc">原创历史地理示意图，展示四川盆地、成都平原、重庆、汉中、剑门、三峡、主要河流和对外通道。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef6fb"/>
      <stop offset="1" stop-color="#f8f4e8"/>
    </linearGradient>
    <linearGradient id="basin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d98d"/>
      <stop offset="1" stop-color="#e8bd69"/>
    </linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cce8a6"/>
      <stop offset="1" stop-color="#9dce77"/>
    </linearGradient>
    <pattern id="hills" width="42" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 24 Q10 8 21 24 Q31 8 42 24" fill="none" stroke="#9c7447" stroke-width="2" opacity="0.45"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#a94135"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2c3e50" flood-opacity="0.22"/>
    </filter>
    <style>
      .title{font:700 34px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#203040}
      .subtitle{font:500 17px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52606d}
      .region{font:700 22px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#4a3728}
      .city{font:700 18px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#1f2f3d}
      .small{font:500 15px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#34495e}
      .mountain{font:600 17px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#6b4d2e}
      .riverLabel{font:600 16px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#1769aa}
      .routeLabel{font:600 15px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8e332c}
      .legend{font:500 14px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#2f3f4f}
    </style>
  </defs>

  <rect width="1400" height="980" fill="url(#bg)"/>
  <text x="700" y="52" text-anchor="middle" class="title">巴蜀地理骨架与对外通道</text>
  <text x="700" y="82" text-anchor="middle" class="subtitle">原创示意图：强调盆地、山地、水系、门户与历史交通，不代表精确行政边界或比例</text>

  <!-- Surrounding mountain arcs -->
  <path d="M220 280 Q350 135 570 150 Q790 105 1035 190" fill="none" stroke="#7b5d3e" stroke-width="56" opacity="0.20" stroke-linecap="round"/>
  <path d="M220 280 Q350 135 570 150 Q790 105 1035 190" fill="none" stroke="#8e6b45" stroke-width="9" stroke-dasharray="17 10" stroke-linecap="round"/>
  <path d="M1040 195 Q1195 305 1208 520 Q1205 700 1080 790" fill="none" stroke="#7b5d3e" stroke-width="54" opacity="0.20" stroke-linecap="round"/>
  <path d="M1040 195 Q1195 305 1208 520 Q1205 700 1080 790" fill="none" stroke="#8e6b45" stroke-width="9" stroke-dasharray="17 10" stroke-linecap="round"/>
  <path d="M1080 790 Q780 900 460 845 Q275 820 180 630" fill="none" stroke="#7b5d3e" stroke-width="54" opacity="0.20" stroke-linecap="round"/>
  <path d="M1080 790 Q780 900 460 845 Q275 820 180 630" fill="none" stroke="#8e6b45" stroke-width="9" stroke-dasharray="17 10" stroke-linecap="round"/>
  <path d="M180 630 Q110 480 220 280" fill="none" stroke="#7b5d3e" stroke-width="54" opacity="0.20" stroke-linecap="round"/>
  <path d="M180 630 Q110 480 220 280" fill="none" stroke="#8e6b45" stroke-width="9" stroke-dasharray="17 10" stroke-linecap="round"/>

  <!-- Basin -->
  <path d="M250 300 Q380 210 570 220 Q780 180 1000 260 Q1100 345 1110 525 Q1090 685 995 752 Q800 830 565 795 Q355 780 245 650 Q180 480 250 300 Z" fill="url(#basin)" stroke="#9b6b2f" stroke-width="4" filter="url(#shadow)"/>
  <path d="M540 410 Q725 315 990 355 Q1085 445 1030 650 Q875 760 610 710 Q520 560 540 410 Z" fill="url(#hills)" opacity="0.70"/>

  <!-- Chengdu plain -->
  <path d="M275 350 Q365 280 505 300 Q555 380 520 540 Q440 625 305 585 Q245 480 275 350 Z" fill="url(#plain)" stroke="#5f963d" stroke-width="3"/>
  <text x="385" y="458" text-anchor="middle" class="region">成都平原</text>
  <text x="385" y="484" text-anchor="middle" class="small">农业—水利—人口核心</text>

  <!-- Parallel ridge-valley region -->
  <g opacity="0.82">
    <path d="M830 370 Q900 455 885 680" fill="none" stroke="#8a6a45" stroke-width="10"/>
    <path d="M900 340 Q980 455 955 690" fill="none" stroke="#8a6a45" stroke-width="10"/>
    <path d="M965 320 Q1055 445 1025 665" fill="none" stroke="#8a6a45" stroke-width="10"/>
  </g>
  <text x="930" y="730" text-anchor="middle" class="region">川东平行岭谷</text>

  <!-- Rivers -->
  <path d="M315 218 Q300 300 335 355 Q390 470 505 620 Q590 700 710 750" fill="none" stroke="#2b83c6" stroke-width="10" stroke-linecap="round"/>
  <path d="M520 250 Q570 380 590 500 Q610 640 715 750" fill="none" stroke="#4d9ed3" stroke-width="8" stroke-linecap="round"/>
  <path d="M690 240 Q700 370 755 455 Q810 565 940 620" fill="none" stroke="#4d9ed3" stroke-width="8" stroke-linecap="round"/>
  <path d="M795 220 Q790 350 845 455 Q890 550 940 620" fill="none" stroke="#2b83c6" stroke-width="10" stroke-linecap="round"/>
  <path d="M650 775 Q790 760 900 690 Q935 660 940 620 Q1030 615 1120 570 Q1210 530 1315 515" fill="none" stroke="#146aa3" stroke-width="15" stroke-linecap="round"/>

  <text x="300" y="260" class="riverLabel">岷江</text>
  <text x="540" y="332" class="riverLabel">沱江</text>
  <text x="715" y="330" class="riverLabel">涪江</text>
  <text x="820" y="325" class="riverLabel">嘉陵江</text>
  <text x="1125" y="548" class="riverLabel">长江 → 三峡 → 荆楚</text>

  <!-- Cities and passes -->
  <g fill="#263c4a" stroke="#ffffff" stroke-width="3">
    <circle cx="390" cy="430" r="10"/>
    <circle cx="940" cy="620" r="11"/>
    <circle cx="710" cy="750" r="9"/>
    <circle cx="590" cy="500" r="8"/>
    <circle cx="730" cy="370" r="8"/>
    <circle cx="680" cy="240" r="9"/>
    <circle cx="635" cy="285" r="8"/>
    <circle cx="1140" cy="555" r="9"/>
  </g>
  <text x="408" y="420" class="city">成都</text>
  <text x="958" y="612" class="city">重庆（江州）</text>
  <text x="725" y="780" class="city">宜宾</text>
  <text x="605" y="493" class="small">遂宁</text>
  <text x="745" y="360" class="small">南充</text>
  <text x="700" y="232" class="city">广元／葭萌</text>
  <text x="645" y="315" class="small">剑门</text>
  <text x="1155" y="585" class="city">夔门／白帝</text>

  <!-- Hanzhong outside basin -->
  <ellipse cx="690" cy="130" rx="125" ry="45" fill="#d9e5b5" stroke="#6b823f" stroke-width="3"/>
  <circle cx="690" cy="130" r="9" fill="#263c4a" stroke="#fff" stroke-width="3"/>
  <text x="690" y="120" text-anchor="middle" class="city">汉中</text>
  <text x="690" y="148" text-anchor="middle" class="small">北部外堡</text>

  <!-- Dujiangyan -->
  <circle cx="300" cy="350" r="8" fill="#2678a8" stroke="#fff" stroke-width="3"/>
  <text x="218" y="342" class="city">都江堰</text>
  <text x="215" y="365" class="small">岷江分水与灌溉系统</text>

  <!-- Mountain labels -->
  <text x="420" y="168" class="mountain">秦岭—米仓山—大巴山</text>
  <text x="1150" y="325" class="mountain" transform="rotate(64 1150 325)">巫山</text>
  <text x="930" y="882" class="mountain">大娄山及盆地南缘</text>
  <text x="125" y="510" class="mountain" transform="rotate(-72 125 510)">龙门山—邛崃山</text>

  <!-- Routes -->
  <path d="M690 175 Q670 205 645 275" fill="none" stroke="#a94135" stroke-width="5" stroke-dasharray="11 7" marker-end="url(#arrow)"/>
  <text x="725" y="220" class="routeLabel">金牛道／剑门通道</text>

  <path d="M650 115 Q520 80 430 90" fill="none" stroke="#a94135" stroke-width="5" stroke-dasharray="11 7" marker-end="url(#arrow)"/>
  <text x="440" y="70" class="routeLabel">越秦岭至关中</text>

  <path d="M1145 540 Q1230 520 1320 500" fill="none" stroke="#a94135" stroke-width="5" stroke-dasharray="11 7" marker-end="url(#arrow)"/>
  <text x="1200" y="475" class="routeLabel">三峡东出荆楚</text>

  <path d="M735 795 Q760 865 780 920" fill="none" stroke="#a94135" stroke-width="5" stroke-dasharray="11 7" marker-end="url(#arrow)"/>
  <text x="795" y="900" class="routeLabel">南通云贵</text>

  <path d="M285 580 Q170 680 100 760" fill="none" stroke="#a94135" stroke-width="5" stroke-dasharray="11 7" marker-end="url(#arrow)"/>
  <text x="70" y="800" class="routeLabel">西接高原与横断山地</text>

  <!-- Strategic annotations -->
  <g filter="url(#shadow)">
    <rect x="80" y="110" width="255" height="92" rx="14" fill="#ffffff" stroke="#b9c7d2"/>
    <text x="100" y="140" class="small">北线逻辑</text>
    <text x="100" y="166" class="legend">关中 → 汉中 → 剑门 → 成都</text>
    <text x="100" y="190" class="legend">汉中是盆地外堡，剑门是内门槛</text>

    <rect x="1010" y="760" width="310" height="104" rx="14" fill="#ffffff" stroke="#b9c7d2"/>
    <text x="1030" y="790" class="small">双核心逻辑</text>
    <text x="1030" y="816" class="legend">成都：农业、水利、行政与人口</text>
    <text x="1030" y="840" class="legend">重庆：两江汇流、峡江门户与转运</text>
  </g>

  <!-- Legend -->
  <g transform="translate(75 870)">
    <rect width="500" height="82" rx="12" fill="#ffffff" opacity="0.92" stroke="#b7c4ce"/>
    <rect x="20" y="18" width="28" height="18" fill="url(#plain)" stroke="#5f963d"/>
    <text x="58" y="33" class="legend">成都平原</text>
    <rect x="150" y="18" width="28" height="18" fill="url(#basin)" stroke="#9b6b2f"/>
    <text x="188" y="33" class="legend">四川盆地</text>
    <line x1="290" y1="27" x2="330" y2="27" stroke="#146aa3" stroke-width="8"/>
    <text x="340" y="33" class="legend">主要河流</text>
    <line x1="20" y1="58" x2="62" y2="58" stroke="#a94135" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#arrow)"/>
    <text x="78" y="64" class="legend">历史交通方向</text>
    <line x1="235" y1="58" x2="280" y2="58" stroke="#8e6b45" stroke-width="8" stroke-dasharray="12 8"/>
    <text x="292" y="64" class="legend">盆周山地</text>
  </g>
</svg>