<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">关中地理骨架与对外通道示意图</title>
  <desc id="desc">原创历史地理示意图，展示关中平原、渭河、秦岭、陇山、黄土高原、潼关、函谷关，以及通往中原、河套、汉中和巴蜀的主要方向。方位与相对关系为主，不作为精确测绘地图使用。</desc>
  <defs>
    <linearGradient id="plain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e7b3"/>
      <stop offset="1" stop-color="#dfc876"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8f63"/>
      <stop offset="1" stop-color="#3e6144"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#9b2f2f"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6f9e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#f7f3ea"/>
  <text x="700" y="55" text-anchor="middle" font-size="34" font-weight="700" fill="#263238">关中地理骨架与对外通道</text>
  <text x="700" y="86" text-anchor="middle" font-size="18" fill="#546e7a">原创历史地理示意图｜强调方向、屏障、河谷与通道，不按精确比例绘制</text>

  <!-- North: Loess Plateau -->
  <path d="M120 130 C320 92, 510 115, 700 95 C910 72, 1120 92, 1300 135 L1300 310 C1110 280, 940 300, 745 275 C560 252, 330 288, 120 260 Z" fill="#d4b57a" opacity="0.72"/>
  <g fill="#b28d52" opacity="0.48">
    <path d="M170 175 q35 -32 70 0 q35 32 70 0 q35 -32 70 0" fill="none" stroke="#9b783f" stroke-width="7"/>
    <path d="M470 150 q35 -32 70 0 q35 32 70 0 q35 -32 70 0" fill="none" stroke="#9b783f" stroke-width="7"/>
    <path d="M810 150 q35 -32 70 0 q35 32 70 0 q35 -32 70 0" fill="none" stroke="#9b783f" stroke-width="7"/>
    <path d="M1110 180 q35 -32 70 0 q35 32 70 0" fill="none" stroke="#9b783f" stroke-width="7"/>
  </g>
  <text x="700" y="175" text-anchor="middle" font-size="30" font-weight="700" fill="#6d4c2f">黄土高原</text>
  <text x="700" y="205" text-anchor="middle" font-size="18" fill="#6d4c2f">北部屏障与农牧交错带｜可通陕北、河套与草原</text>

  <!-- West Longshan -->
  <path d="M110 210 C150 260, 135 330, 175 385 C130 435, 155 500, 115 560 C155 625, 135 700, 180 760 L275 760 C250 690, 280 640, 250 575 C285 515, 250 455, 285 395 C250 330, 285 270, 245 210 Z" fill="url(#mountain)" opacity="0.9"/>
  <g fill="#dfead9" opacity="0.85">
    <path d="M155 300 l35 -55 35 55 z"/>
    <path d="M160 430 l40 -65 40 65 z"/>
    <path d="M150 590 l45 -70 45 70 z"/>
  </g>
  <text x="200" y="470" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff" transform="rotate(-90 200 470)">陇山—六盘山</text>

  <!-- South Qinling -->
  <path d="M180 650 C280 585, 390 635, 500 590 C625 540, 760 630, 880 575 C1010 515, 1160 610, 1320 550 L1320 850 L180 850 Z" fill="url(#mountain)" opacity="0.95"/>
  <g fill="#dfead9" opacity="0.88">
    <path d="M260 700 l70 -100 70 100 z"/>
    <path d="M430 700 l80 -118 80 118 z"/>
    <path d="M650 700 l74 -110 74 110 z"/>
    <path d="M870 690 l78 -118 78 118 z"/>
    <path d="M1100 675 l76 -110 76 110 z"/>
  </g>
  <text x="760" y="760" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">秦岭</text>
  <text x="760" y="793" text-anchor="middle" font-size="18" fill="#eef6ea">南方天然屏障｜有限山口连接汉中与巴蜀</text>

  <!-- Guanzhong plain -->
  <path d="M260 305 C420 270, 610 300, 785 285 C970 270, 1130 300, 1240 350 C1190 430, 1190 510, 1230 565 C1030 590, 850 555, 660 575 C495 592, 340 555, 250 505 C280 430, 280 365, 260 305 Z" fill="url(#plain)" stroke="#b6923e" stroke-width="3" filter="url(#shadow)"/>
  <text x="735" y="365" text-anchor="middle" font-size="38" font-weight="700" fill="#6b4f12">关中平原（渭河谷地）</text>
  <text x="735" y="398" text-anchor="middle" font-size="19" fill="#6b4f12">西窄东宽｜山河环抱｜农业、人口、都城与交通集中</text>

  <!-- Wei River -->
  <path d="M285 455 C430 430, 540 465, 680 445 C830 420, 980 455, 1225 420" fill="none" stroke="#2b7bb9" stroke-width="12" stroke-linecap="round"/>
  <path d="M285 455 C430 430, 540 465, 680 445 C830 420, 980 455, 1225 420" fill="none" stroke="#77bce8" stroke-width="5" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="790" y="435" text-anchor="middle" font-size="24" font-weight="700" fill="#1d5f90">渭河：向东汇入黄河</text>

  <!-- Yellow river at east -->
  <path d="M1250 250 C1225 330, 1260 390, 1235 450 C1210 515, 1260 590, 1230 670" fill="none" stroke="#2b7bb9" stroke-width="13" stroke-linecap="round"/>
  <text x="1292" y="470" text-anchor="middle" font-size="25" font-weight="700" fill="#1d5f90" transform="rotate(90 1292 470)">黄河</text>

  <!-- Cities -->
  <g font-family="sans-serif">
    <g transform="translate(340,430)"><circle r="10" fill="#8b1e1e"/><text x="0" y="-20" text-anchor="middle" font-size="22" font-weight="700">陈仓／宝鸡</text></g>
    <g transform="translate(660,442)"><circle r="11" fill="#8b1e1e"/><text x="0" y="-22" text-anchor="middle" font-size="22" font-weight="700">咸阳</text></g>
    <g transform="translate(775,455)"><circle r="13" fill="#8b1e1e"/><circle r="20" fill="none" stroke="#8b1e1e" stroke-width="3"/><text x="0" y="45" text-anchor="middle" font-size="24" font-weight="700">长安</text></g>
    <g transform="translate(1010,435)"><circle r="10" fill="#8b1e1e"/><text x="0" y="-20" text-anchor="middle" font-size="21" font-weight="700">华阴</text></g>
    <g transform="translate(1178,420)"><circle r="12" fill="#8b1e1e"/><text x="0" y="-24" text-anchor="middle" font-size="24" font-weight="700">潼关</text></g>
    <g transform="translate(1300,390)"><circle r="9" fill="#5d4037"/><text x="0" y="-20" text-anchor="middle" font-size="20" font-weight="700">函谷关</text></g>
  </g>

  <!-- Routes and arrows -->
  <path d="M1190 390 C1250 350, 1300 330, 1360 325" fill="none" stroke="#9b2f2f" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <text x="1270" y="295" text-anchor="middle" font-size="22" font-weight="700" fill="#8b1e1e">东出中原：洛阳／河南</text>

  <path d="M410 390 C330 330, 280 285, 235 225" fill="none" stroke="#9b2f2f" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <text x="325" y="280" text-anchor="middle" font-size="21" font-weight="700" fill="#8b1e1e">西通陇右／河西</text>

  <path d="M650 360 C610 280, 620 230, 650 170" fill="none" stroke="#9b2f2f" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <text x="560" y="245" text-anchor="middle" font-size="21" font-weight="700" fill="#8b1e1e">北上陕北、河套</text>

  <path d="M765 500 C750 565, 730 620, 705 705" fill="none" stroke="#9b2f2f" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <text x="835" y="610" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">子午道等：汉中</text>

  <path d="M400 500 C390 560, 365 620, 335 705" fill="none" stroke="#9b2f2f" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <text x="415" y="620" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">陈仓道／褒斜道</text>

  <!-- Pass labels -->
  <g font-size="18" fill="#263238">
    <rect x="1120" y="485" width="175" height="54" rx="10" fill="#fff" opacity="0.9" stroke="#8b1e1e"/>
    <text x="1207" y="508" text-anchor="middle" font-weight="700">东部门户</text>
    <text x="1207" y="530" text-anchor="middle">潼关—函谷关体系</text>

    <rect x="250" y="505" width="170" height="54" rx="10" fill="#fff" opacity="0.9" stroke="#8b1e1e"/>
    <text x="335" y="528" text-anchor="middle" font-weight="700">西部门户</text>
    <text x="335" y="550" text-anchor="middle">陈仓—陇山通道</text>
  </g>

  <!-- Legend -->
  <g transform="translate(1010,735)">
    <rect width="320" height="120" rx="16" fill="#ffffff" opacity="0.93" stroke="#c9c1b4"/>
    <text x="20" y="30" font-size="19" font-weight="700" fill="#263238">图例</text>
    <rect x="20" y="46" width="34" height="18" fill="#dfc876"/><text x="68" y="61" font-size="17">平原与河谷</text>
    <rect x="170" y="46" width="34" height="18" fill="#4f744d"/><text x="218" y="61" font-size="17">山地屏障</text>
    <line x1="20" y1="84" x2="54" y2="84" stroke="#2b7bb9" stroke-width="8"/><text x="68" y="90" font-size="17">主要水系</text>
    <line x1="170" y1="84" x2="204" y2="84" stroke="#9b2f2f" stroke-width="5" stroke-dasharray="8 5"/><text x="218" y="90" font-size="17">战略通道</text>
  </g>

  <!-- North arrow -->
  <g transform="translate(90,90)">
    <path d="M0 50 L20 0 L40 50 L20 40 Z" fill="#263238"/>
    <text x="20" y="75" text-anchor="middle" font-size="22" font-weight="700">北</text>
  </g>
</svg>